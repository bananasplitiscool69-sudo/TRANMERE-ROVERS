<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profiles | Tranmere Rovers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">

  <style>
    .members { max-width: 700px; margin: 0 auto; text-align: left; }

    .member {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 1.5rem;
      border-radius: 28px;
      cursor: pointer;
    }
    .member:hover { background: rgba(0, 0, 0, 0.15); }

    .member img {
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: #999999;
    }

    .member .name {
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    /* ---------- full screen stats page ---------- */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem 2rem;
      background: #00558c;
      overflow-y: auto;
      z-index: 1000;
    }
    #overlay[hidden] { display: none; }

    #close {
      position: fixed;
      top: 0.75rem;
      right: 1.25rem;
      padding: 0 0.5rem;
      background: none;
      border: none;
      color: #111111;
      font-family: inherit;
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
    }
    #close:hover { opacity: 0.6; }

    .modal { width: 100%; max-width: 520px; margin: auto; text-align: center; }

    .m-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      background: #999999;
    }

    .m-name {
      margin: 1rem 0 2rem;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .m-stats { text-align: left; }

    .stat {
      display: flex;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 0.9rem 0.25rem;
      border-top: 1px solid rgba(0, 0, 0, 0.35);
      font-size: 1.3rem;
      font-weight: 600;
    }
    .stat .value { font-weight: 700; }
    .stat.total { font-size: 1.5rem; }
  </style>
</head>
<body>
  <h1>PROFILES</h1>
  <a class="back" href="index.html">← BACK</a>

  <div id="members" class="members">Loading…</div>

  <div id="overlay" hidden>
    <button id="close" aria-label="Close">×</button>
    <div class="modal" role="dialog" aria-modal="true">
      <img id="m-img" class="m-img" alt="">
      <h2 id="m-name" class="m-name"></h2>
      <div id="m-stats" class="m-stats"></div>
    </div>
  </div>

  <script>
    const STAT_ROWS = [
      ["⚽", "Goals", "goals"],
      ["🅰️", "Assists", "assists"],
      ["🧱", "Clean Sheets (DEF)", "def_cs"],
      ["🧤", "Clean Sheets (GK)", "gk_cs"],
      ["🏅", "Total Points", "points"],
    ];

    const overlay = document.getElementById("overlay");

    function openProfile(p) {
      document.getElementById("m-img").src = p.avatar;
      document.getElementById("m-name").textContent = p.name;

      const box = document.getElementById("m-stats");
      box.textContent = "";
      for (const [icon, label, key] of STAT_ROWS) {
        const row = document.createElement("div");
        row.className = "stat" + (key === "points" ? " total" : "");

        const l = document.createElement("span");
        l.textContent = icon + " " + label + ":";

        const v = document.createElement("span");
        v.className = "value";
        v.textContent = p[key] ?? 0;

        row.append(l, v);
        box.append(row);
      }
      overlay.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeProfile() {
      overlay.hidden = true;
      document.body.style.overflow = "";
    }

    document.getElementById("close").onclick = closeProfile;
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProfile(); });

    fetch("members.json?t=" + Date.now())
      .then(r => r.json())
      .then(list => {
        const box = document.getElementById("members");
        box.textContent = "";
        if (!list.length) {
          box.textContent = "No members yet.";
          return;
        }
        for (const p of list) {
          const row = document.createElement("div");
          row.className = "member";
          row.tabIndex = 0;
          row.onclick = () => openProfile(p);
          row.onkeydown = (e) => { if (e.key === "Enter") openProfile(p); };

          const img = document.createElement("img");
          img.src = p.avatar;
          img.alt = "";
          img.loading = "lazy";

          const name = document.createElement("span");
          name.className = "name";
          name.textContent = p.name;

          row.append(img, name);
          box.append(row);
        }
      })
      .catch(() => {
        document.getElementById("members").textContent =
          "Couldn’t load members yet. Try again in a few minutes.";
      });
  </script>
</body>
</html>
