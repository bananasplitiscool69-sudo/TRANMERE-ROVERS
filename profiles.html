<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profiles | Tranmere Rovers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <h1>PROFILES</h1>
  <a class="back" href="index.html">← BACK</a>

  <input id="search" class="search" type="search" placeholder="Search players…" autocomplete="off">

  <div id="members" class="members"><p class="message">Loading…</p></div>

  <div id="overlay" class="overlay" hidden>
    <button id="close" class="close" aria-label="Close">×</button>
    <div class="modal" role="dialog" aria-modal="true">
      <img id="m-img" class="m-img" alt="">
      <h2 id="m-name" class="m-name"></h2>
      <p id="m-rank" class="m-rank"></p>
      <div id="m-stats" class="m-stats"></div>
    </div>
  </div>

  <script>
    const STAT_ROWS = [
      ["⚽", "Goals", "goals"],
      ["🅰️", "Assists", "assists"],
      ["🧱", "Clean Sheets (DEF)", "def_cs"],
      ["🧤", "Clean Sheets (GK)", "gk_cs"],
      ["🏅", "Total Points", "points"],
    ];

    const overlay = document.getElementById("overlay");
    const box = document.getElementById("members");
    let everyone = [];

    function openProfile(p) {
      document.getElementById("m-img").src = p.avatar;
      document.getElementById("m-name").textContent = p.name;
      document.getElementById("m-rank").textContent = p.rank ? p.rank + " rank" : "";

      const stats = document.getElementById("m-stats");
      stats.textContent = "";
      for (const [icon, label, key] of STAT_ROWS) {
        const row = document.createElement("div");
        row.className = "stat" + (key === "points" ? " total" : "");

        const l = document.createElement("span");
        l.textContent = icon + " " + label + ":";

        const v = document.createElement("span");
        v.className = "value";
        v.textContent = p[key] ?? 0;

        row.append(l, v);
        stats.append(row);
      }
      overlay.hidden = false;
      overlay.scrollTop = 0;
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";
    }

    function closeProfile() {
      overlay.hidden = true;
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
    }

    function render(list) {
      box.textContent = "";
      if (!list.length) {
        const msg = document.createElement("p");
        msg.className = "message";
        msg.textContent = "No players found.";
        box.append(msg);
        return;
      }
      for (const p of list) {
        const row = document.createElement("div");
        row.className = "member";
        row.tabIndex = 0;
        row.onclick = () => openProfile(p);
        row.onkeydown = (e) => { if (e.key === "Enter") openProfile(p); };

        const img = document.createElement("img");
        img.src = p.avatar;
        img.alt = "";
        img.loading = "lazy";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = p.name;

        row.append(img, name);
        box.append(row);
      }
    }

    document.getElementById("close").onclick = closeProfile;
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProfile(); });

    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      render(everyone.filter(p => p.name.toLowerCase().includes(q)));
    });

    fetch("members.json?t=" + Date.now())
      .then(r => r.json())
      .then(list => { everyone = list; render(list); })
      .catch(() => {
        box.textContent = "";
        const msg = document.createElement("p");
        msg.className = "message";
        msg.textContent = "Couldn’t load members yet. Try again in a few minutes.";
        box.append(msg);
      });
  </script>
</body>
</html>
